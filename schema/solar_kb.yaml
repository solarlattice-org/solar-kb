id: https://solarlattice.org/kb/schema
name: solar_kb
title: Solar Lattice knowledge schema
version: 0.5.0
license: CC-BY-4.0
description: >-
  Typed records and cited claims for solar PV domain knowledge.
  Every relation and every quantity is a Claim that cites evidence.
  The schema is split into modules (core, failure, equipment, events, control, communication, practice,
  regulation, engineering, overlay); every term keeps its kb: IRI whichever module defines it.
# Every prefix is declared here, in the root: solar_kb.iri.load_prefixes reads this map first.
prefixes:
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
  kb: https://solarlattice.org/kb/
  fm: https://solarlattice.org/kb/fm/
  stressor: https://solarlattice.org/kb/stressor/
  symptom: https://solarlattice.org/kb/symptom/
  meas: https://solarlattice.org/kb/meas/
  method: https://solarlattice.org/kb/method/
  mit: https://solarlattice.org/kb/mit/
  comp: https://solarlattice.org/kb/comp/
  src: https://solarlattice.org/kb/src/
  fc: https://solarlattice.org/kb/fc/
  ec: https://solarlattice.org/kb/ec/
  case: https://solarlattice.org/kb/case/
  dex: https://solarlattice.org/kb/dex/
  org: https://solarlattice.org/kb/org/
  region: https://solarlattice.org/kb/region/
  role: https://solarlattice.org/kb/role/
  prod: https://solarlattice.org/kb/prod/
  fw: https://solarlattice.org/kb/fw/
  tool: https://solarlattice.org/kb/tool/
  state: https://solarlattice.org/kb/state/
  func: https://solarlattice.org/kb/func/
  param: https://solarlattice.org/kb/param/
  profile: https://solarlattice.org/kb/profile/
  proto: https://solarlattice.org/kb/proto/
  reg: https://solarlattice.org/kb/reg/
  proc: https://solarlattice.org/kb/proc/
  hazard: https://solarlattice.org/kb/hazard/
  std: https://solarlattice.org/kb/std/
  req: https://solarlattice.org/kb/req/
  prog: https://solarlattice.org/kb/prog/
  concept: https://solarlattice.org/kb/concept/
  metric: https://solarlattice.org/kb/metric/
  calc: https://solarlattice.org/kb/calc/
  arch: https://solarlattice.org/kb/arch/
  unit: http://qudt.org/vocab/unit/
default_prefix: kb
default_range: string
imports:
  - linkml:types
  - solar_kb_core
  - solar_kb_failure
  - solar_kb_equipment
  - solar_kb_events
  - solar_kb_control
  - solar_kb_communication
  - solar_kb_practice
  - solar_kb_regulation
  - solar_kb_engineering
  - solar_kb_overlay
